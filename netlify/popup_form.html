<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Log media hit</title>

  <!-- Makes the form look reasonable on smaller screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /*
      This is intentionally basic styling.
      The goal right now is: readable, simple, testable.
    */

    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f5f5f5;
      color: #222;
    }

    main {
      max-width: 650px;
      margin: 0 auto;
      padding: 24px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 8px;
      font: inherit;
    }

    textarea {
      min-height: 100px;
    }

    button {
      margin-top: 20px;
      padding: 10px 14px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .help {
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <main>
    <h1>Log media hit</h1>

    <p class="help">
      This form was pre-filled from the article page. Review the fields before submitting.
    </p>

    <!--
      This is where the form will eventually submit.

      For now, it points to create_media_hit.
      That function can be built later.
    -->
    <form method="POST" action="/.netlify/functions/create_media_hit">

      <!-- Headline from the article -->
      <label for="headline">Headline</label>
      <input
        id="headline"
        name="headline"
        type="text"
        value="{{headline}}"
        required
      >

      <!-- Article URL -->
      <label for="source_url">Article URL</label>
      <input
        id="source_url"
        name="source_url"
        type="url"
        value="{{source_url}}"
        required
      >

      <!-- Publisher / outlet -->
      <label for="publisher">Publisher / outlet</label>
      <input
        id="publisher"
        name="publisher"
        type="text"
        value="{{publisher}}"
      >

      <!-- Author / reporter -->
      <label for="author">Author / reporter</label>
      <input
        id="author"
        name="author"
        type="text"
        value="{{author}}"
      >

      <!-- Publication date -->
      <label for="date_published">Date published</label>
      <input
        id="date_published"
        name="date_published"
        type="date"
        value="{{date_published}}"
      >

      <!-- Placeholder submitter field -->
      <label for="submitted_by">Submitted by</label>
      <select id="submitted_by" name="submitted_by">
        <option value="">Choose...</option>
        <option value="Adam Burns">Adam Burns</option>
        <option value="Other">Other / not listed</option>
      </select>

      <!-- Optional notes -->
      <label for="notes">Notes</label>
      <textarea
        id="notes"
        name="notes"
        placeholder="Optional context, topics, spokesperson mentioned, etc."
      ></textarea>

      <button type="submit">Submit media hit</button>
    </form>
  </main>
</body>
</html>
