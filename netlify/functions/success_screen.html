<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SHARE Media Logger</title>
</head>
<body>
  <main>
    <h1>Success! Media hit created</h1>
    <p>
      Thank you for logging this media hit.
      <br><br>
      It's now available in <a href="{{SF_LINK}}" target="_blank" rel="noopener noreferrer">Salesforce</a>, where you can add more details and/or view the rest of our media database.
      <br><br>
      This window will close automatically in 5 seconds.
    </p>
  </main>
  <script>
    // Close the window after a short delay
    setTimeout(() => {
      window.close();
    }, 5000); 
  </script>
</body>
</html>
