<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SHARE Media Logger</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>Media hit created</h1>
    <p class="success-message">
      The media hit was submitted successfully.
    </p>
    <dl>
      <dt>Article Name</dt>
      <dd>{{ARTICLE_NAME}}</dd>
      <dt>Publisher</dt>
      <dd>{{PUBLISHER}}</dd>
      <dt>Author</dt>
      <dd>{{AUTHOR}}</dd>
      <dt>Date published</dt>
      <dd>{{DATE_PUBLISHED}}</dd>
      <dt>Article URL</dt>
      <dd>
        <a href="{{LINK_TO_ARTICLE}}" target="_blank" rel="noopener noreferrer">
          {{LINK_TO_ARTICLE}}
        </a>
      </dd>
      <dt>Salesforce ID</dt>
      <dd>{{SALESFORCE_ID}}</dd>
    </dl>
    <div class="actions">
      <a class="button" href="{{SALESFORCE_URL}}" target="_blank" rel="noopener noreferrer">
        View in Salesforce
      </a>
      <a class="button" href="{{LINK_TO_ARTICLE}}" target="_blank" rel="noopener noreferrer">
        Return to article
      </a>
    </div>
  </main>
</body>
</html>
