<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Log media hit</title>

  <!-- Makes the form look reasonable on smaller screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/.netlify/functions/styles.css">

</head>

<body>
  <main>
    <h1>SHARE Media Logger</h1>

    <p class="help">
      This form was pre-filled from the article page. Review the fields before submitting.
    </p>

    <form method="POST" action="/.netlify/functions/create_media_hit">

      <!-- Headline from the article -->
      <label for="article_name">Article Name</label>
      <input
        id="article_name"
        name="article_name"
        type="text"
        value="{{article_name}}"
        required
      >

      <!-- Article URL -->
      <label for="link_to_article">Article URL</label>
      <input
        id="link_to_article"
        name="link_to_article"
        type="url"
        value="{{link_to_article}}"
        required
      >

      <!-- Publisher / outlet -->
      <label for="publisher">Publisher / outlet</label>
      <input
        id="publisher"
        name="publisher"
        type="text"
        value=""
        placeholder="The Daily Planet"
      >

      <!-- Author / reporter -->
      <label for="author">Author / reporter</label>
      <input
        id="author"
        name="author"
        type="text"
        value=""
        placeholder="Clark Kent"
      >

      <!-- Publication date -->
      <label for="date_published">Date published</label>
      <input
        id="date_published"
        name="date_published"
        type="date"
        value=""
      >

      <!-- Placeholder submitter field -->
      <label for="submitted_by">Submitted by</label>
      <select id="submitted_by" name="submitted_by">
        <option value="">Choose...</option>
        <option value="Adam Burns">Adam Burns</option>
        <option value="Other">Other / not listed</option>
      </select>

      <!-- Optional notes -->
      <label for="notes">Notes</label>
      <textarea
        id="notes"
        name="notes"
        placeholder="Optional context, topics, spokesperson mentioned, etc."
      ></textarea>

      <button type="submit">Submit media hit</button>
    </form>
  </main>
</body>
</html>
