<!doctype html>
<html lang="en">
<head>
  <title>SHARE Media Logger: Add Media Hit</title>
</head>
<body>
  <main>
    <header>
      Thank you for adding a media hit to SHARE's Salesforce database!
      <br>
      Some of this form's fields will have auto-populated when you activated the bookmarklet.
      <br>
      Please double-check their accuracy, and fill in as many of the other fields as you can.
      <br>
      If you have any questions, please <a id="adam_email" href="mailto:{{adam_email}}">contact Adam</a>.
    </header>
    <br>
    <form method="POST" action="/.netlify/functions/sf_create_media_hit">
      <!-- Name -->
      <label for="article_name">Article name/Headline: </label>
      <input id="article_name" name="article_name" type="text" value="{{article_name}}" required>
      <br><br>
      <!-- Link_to_article__c -->
      <label for="link_to_article">Article URL: </label>
      <input id="link_to_article" name="link_to_article" type="url" value="{{link_to_article}}" required>
      <br><br>
      <!-- Media_Outlet_Organization__c -->
      <label for="publisher" title="This field only allows organizations that have been added to Salesforce as media outlets. If the outlet is not listed here, you'll have to add it to SF.">Publisher/Outlet: </label>
      <select id="publisher" name="publisher">
        <option value="">Loading media outlets...</option>
      </select>
      <br><br>
      <!-- Reporter__c -->
      <label for="author" title="This field only allows contacts who have already been added to Salesforce as reporters. If the reporter is not listed here, leave it blank for now — and consider adding them to SF later!">Reporter/Author: </label>
      <select id="author" name="author">
        <option value="">Loading reporters...</option>
      </select>
      <br><br>
      <!--
      < !-- Related_Organization__c -- >
      <label for="related_organization_1" title="">Related organization (primary)</label>
      <select id="related_organization_1" name="related_organization_1">
        <option value="">Loading organizations...</option>
      </select>
      <br><br>
      < !-- Related_Organization_secondary__c -- >
      <label for="related_organization_2" title="">Related organization (secondary)</label>
      <select id="related_organization_2" name="related_organization_2">
        <option value="">Loading organizations...</option>
      </select>
      <br><br>
      < !-- Related_Organization_third__c -- >
      <label for="related_organization_3" title="">Related organization (tertiary)</label>
      <select id="related_organization_3" name="related_organization_3">
        <option value="">Loading organizations...</option>
      </select>
      <br><br>
      -->
      <!-- Date_of_article__c -->
      <label for="date_of_article">Date the article was published: </label>
      <input id="date_of_article" name="date_of_article" type="date" value="">
      <br><br>
      <!-- SHARE_related__c -->
      <label for="is_share_related" title="Does it mention SHARE or its work?">Is the article SHARE-related?</label>
      <input id="is_share_related" name="is_share_related" type="checkbox" value="false">
      <br><br>
      <!-- SHARE_spokesperson__c -->
      <label for="share_spokesperson">SHARE spokesperson: </label>
      <select id="share_spokesperson" name="share_spokesperson">
        <option value="">Loading SHARE contacts...</option>
      </select>
      <br><br>
      <!-- Media_classification__c -->
      <label for="topics" title="Select one or more topics that the article covers. Use Ctrl+Click (Windows) or Command+Click (Mac) to select multiple topics.">Topic(s)</label>
      <select id="topics" name="topics" multiple>
        <option value="Air Pollution">Air Pollution</option>
        <option value="Artificial Intelligence">Artificial Intelligence</option>
        <option value="Asset Management">Asset Management</option>
        <option value="Banking">Banking</option>
        <option value="Biofuel">Biofuel</option>
        <option value="Board Of Directors">Board Of Directors</option>
        <option value="Business Governance">Business Governance</option>
        <option value="Business Reporting And Performance">Business Reporting And Performance</option>
        <option value="Capital Goods">Capital Goods</option>
        <option value="Civil Rights">Civil Rights</option>
        <option value="Climate Change">Climate Change</option>
        <option value="Coal">Coal</option>
        <option value="Data Protection Policy">Data Protection Policy</option>
        <option value="Diversity, Equity And Inclusion">Diversity, Equity And Inclusion</option>
        <option value="Economic Policy">Economic Policy</option>
        <option value="Economy, Business And Finance">Economy, Business And Finance</option>
        <option value="Electricity">Electricity</option>
        <option value="Employment">Employment</option>
        <option value="Energy And Resource">Energy And Resource</option>
        <option value="Energy Industry">Energy Industry</option>
        <option value="Energy Policy">Energy Policy</option>
        <option value="Energy Resources">Energy Resources</option>
        <option value="Energy Saving">Energy Saving</option>
        <option value="Environment">Environment</option>
        <option value="Environmental, Social And Governance Policy (ESG)">Environmental, Social And Governance Policy (ESG)</option>
        <option value="Environmental Policy">Environmental Policy</option>
        <option value="Environmental Pollution">Environmental Pollution</option>
        <option value="ESG Policy (Environmental, Social and Governance Policy)">ESG Policy (Environmental, Social and Governance Policy)</option>
        <option value="Financial Advisory Service">Financial Advisory Service</option>
        <option value="Financial And Business Service">Financial And Business Service</option>
        <option value="Forestry And Timber">Forestry And Timber</option>
        <option value="Forests">Forests</option>
        <option value="Global Warming">Global Warming</option>
        <option value="Government Policy">Government Policy</option>
        <option value="Health">Health</option>
        <option value="Healthcare Industry">Healthcare Industry</option>
        <option value="Healthcare Policy">Healthcare Policy</option>
        <option value="Health Care Provider">Health Care Provider</option>
        <option value="Health Insurance">Health Insurance</option>
        <option value="Housing And Urban Planning Policy">Housing And Urban Planning Policy</option>
        <option value="Human Rights">Human Rights</option>
        <option value="Identification Technology">Identification Technology</option>
        <option value="Indigenous People">Indigenous People</option>
        <option value="Infrastructure Policy">Infrastructure Policy</option>
        <option value="Labor Market">Labor Market</option>
        <option value="Labor Relations">Labor Relations</option>
        <option value="Land Resources">Land Resources</option>
        <option value="Media And Entertainment Industry">Media And Entertainment Industry</option>
        <option value="Natural Gas">Natural Gas</option>
        <option value="Natural Resources">Natural Resources</option>
        <option value="Nuclear Policy">Nuclear Policy</option>
        <option value="Nuclear Power">Nuclear Power</option>
        <option value="Oil And Gas">Oil And Gas</option>
        <option value="Oil And Gas - Downstream Activities">Oil And Gas - Downstream Activities</option>
        <option value="Oil And Gas - Upstream Activities">Oil And Gas - Upstream Activities</option>
        <option value="Pension">Pension</option>
        <option value="Pharmaceutical">Pharmaceutical</option>
        <option value="Policy Towards Indigenous People">Policy Towards Indigenous People</option>
        <option value="Proxy Filing">Proxy Filing</option>
        <option value="Public Housing">Public Housing</option>
        <option value="Public Transport">Public Transport</option>
        <option value="Regulation Of Industry">Regulation Of Industry</option>
        <option value="Regulatory Authority">Regulatory Authority</option>
        <option value="Renewable Energy">Renewable Energy</option>
        <option value="Securities">Securities</option>
        <option value="Shareholder Activity">Shareholder Activity</option>
        <option value="Sustainability">Sustainability</option>
        <option value="Unions">Unions</option>
        <option value="Utilities">Utilities</option>
        <option value="Wages And Benefits">Wages And Benefits</option>
        <option value="Waste Management">Waste Management</option>
        <option value="Water Pollution">Water Pollution</option>
        <option value="Workplace Health And Safety">Workplace Health And Safety</option>
      </select>
      <br><br>
      <!-- Channel__c -->
      <label for="channel" title="(According to the PESO model)">Channel</label>
      <select id="channel" name="channel">
        <option value="paid" title="Ads, sponsored content, 'advertorial' etc.">Paid</option>
        <option value="earned" title="Unpaid coverage in traditional/online media">Earned</option>
        <option value="shared" title="Social media posts/articles/discussions">Shared</option>
        <option value="owned" title="Posts and articles published by the organization itself">Owned</option>
      </select>
      <br><br>
      <!-- Format__c -->
      <label for="format">Format</label>
      <select id="format" name="format">
        <option value="news">News</option>
        <option value="opinion">Opinion</option>
        <option value="profile">Profile</option>
        <option value="press-release">Press Release</option>
        <option value="blog">Blog</option>
        <option value="audio">Audio</option>
        <option value="video">Video</option>
        <option value="newsletter">Newsletter</option>
        <option value="other">Other</option>
      </select>
      <br><br>
      <!-- Submitted_By__c -->
      <label for="submitted_by">Submitted by: </label>
      <select id="submitted_by" name="submitted_by">
        <option value="">Loading SHARE users...</option>
      </select>
      <br><br>
      <!-- Description_Notes__c -->
      <label for="notes">Notes: </label>
      <textarea id="notes" name="notes" placeholder="Context, questions..."></textarea>
      <br><br>
      <button type="submit">SUBMIT</button>
    </form>
  </main>
<script>
  async function populateSelect(endpoint, selectId) {
  const response = await fetch(endpoint);
  const data = await response.json();

  const select = document.getElementById(selectId);

  select.innerHTML = '<option value="">Choose...</option>';

  for (const record of data.records) {
    const option = document.createElement("option");

    option.value = record.id;
    option.textContent = record.name;

    select.appendChild(option);
  }
}
  populateSelect("/.netlify/functions/sf_get_media_outlets", "publisher");
  populateSelect("/.netlify/functions/sf_get_reporters", "author");
  populateSelect("/.netlify/functions/sf_get_share_contacts", "share_spokesperson");
  populateSelect("/.netlify/functions/sf_get_share_users", "submitted_by");
  //populateSelect("/.netlify/functions/sf_get_organizations", "related_organization_1");
  //populateSelect("/.netlify/functions/sf_get_organizations", "related_organization_2");
  //populateSelect("/.netlify/functions/sf_get_organizations", "related_organization_3");
</script>
</body>
</html>
