<!doctype html>
<html lang="en">
<head>
  <title>SHARE Media Logger: Add Media Hit</title>
</head>
<body>
  <main>
    <header>
      Thank you for adding a media hit to SHARE's Salesforce database!
      <br>
      Some of this form's fields will have auto-populated when you activated the bookmarklet.
      <br>
      Please double-check their accuracy, and fill in as many of the other fields as you can.
      <br>
      If you have any questions, please <a id="adam_email" href="mailto:{{adam_email}}">contact Adam</a>.
    </header>
    <br>
    <form method="POST" action="/.netlify/functions/sf_create_media_hit">
      <!-- Name -->
      <label for="article_name" title="The headline or title of the article. Should populate automatically.">Article name/Headline: </label>
      <input id="article_name" name="article_name" type="text" value="{{article_name}}" required>
      <br><br>
      <!-- Link_to_article__c -->
      <label for="link_to_article" title="The URL (link) for the article. Should populate automatically.">Article URL: </label>
      <input id="link_to_article" name="link_to_article" type="url" value="{{link_to_article}}" required>
      <br><br>
      <!-- Media_Outlet_Organization__c -->
      <label for="publisher" title="Which organization published the article? This field only allows organizations that have been added to Salesforce as media outlets. (If the outlet isn't listed, you'll have to add it to SF to log the hit.)">Publisher/Outlet: </label>
      <select id="publisher" name="publisher">
        <option value="">Loading media outlets...</option>
      </select>
      <br><br>
      <!-- Reporter__c -->
      <label for="author" title="Who wrote the article? This field currently only allows contacts who have already been added to Salesforce as reporters. If the reporter is not listed here, leave it blank for now — and consider adding them to SF later.">Reporter/Author: </label>
      <select id="author" name="author">
        <option value="">Loading reporters...</option>
      </select>
      <br><br>
      <!-- Date_of_article__c -->
      <label for="date_of_article" title="When was the article published? This is a required field.">Publication date: </label>
      <input id="date_of_article" name="date_of_article" type="date" value="" required>
      <br><br>
      <!-- SHARE_related__c -->
      <label for="is_share_related" title="Does the article mention SHARE or its work?">SHARE-related? </label>
      <input id="is_share_related" name="is_share_related" type="checkbox" checked>
      <br><br>
      <!-- SHARE_spokesperson__c -->
      <label for="share_spokesperson" title="If the article is SHARE-related, who is the SHARE spokesperson quoted?">SHARE spokesperson: </label>
      <select id="share_spokesperson" name="share_spokesperson">
        <option value="">Loading SHARE contacts...</option>
      </select>
      <br><br>
      <!-- Media_classification__c -->
      <label for="topics" title="Select one or more topics that the article covers. Use Ctrl+Click (Windows) or Command+Click (Mac) to select multiple topics.">Topic(s): </label>
      <select id="topics" name="topics" multiple>
        <option value="Artificial Intelligence">Artificial Intelligence</option>
        <option value="Affordable Housing">Affordable Housing</option>
        <option value="Asset Manager Accountability">Asset Manager Accountability</option>
        <option value="Clean Electricity">Clean Electricity</option>
        <option value="Climate Risk">Climate Risk</option>
        <option value="Corporate Governance">Corporate Governance</option>
        <option value="Decent Work">Decent Work</option>
        <option value="Energy Financing">Energy Financing</option>
        <option value="Government Policy and Regulation">Government Policy and Regulation</option>
        <option value="Health-care">Health-care</option>
        <option value="Human Rights">Human Rights</option>
        <option value="Mining">Mining</option>
        <option value="Racial Equity">Racial Equity</option>
        <option value="Reconciliation">Reconciliation</option>
        <option value="Utilities">Utilities</option>
      </select>
      <br><br>
      <!-- Channel__c -->
      <label for="channel" title="(According to the PESO model)">Channel: </label>
      <select id="channel" name="channel">
        <option value="paid" title="Ads, sponsored content, 'advertorial' etc.">Paid</option>
        <option value="earned" title="Unpaid coverage in traditional/online media" selected>Earned</option>
        <option value="shared" title="Social media posts/articles/discussions">Shared</option>
        <option value="owned" title="Posts and articles published by the organization itself">Owned</option>
      </select>
      <br><br>
      <!-- Format__c -->
      <label for="format" title="What type of content is the article?">Format: </label>
      <select id="format" name="format">
        <option value="News">News</option>
        <option value="Opinion">Opinion</option>
        <option value="Profile">Profile</option>
        <option value="Press Release">Press Release</option>
        <option value="Blog">Blog</option>
        <option value="Audio">Audio</option>
        <option value="Video">Video</option>
        <option value="Newsletter">Newsletter</option>
        <option value="Other">Other</option>
      </select>
      <br><br>
      <!-- Submitted_By__c -->
      <label for="submitted_by" title="Who is submitting this media hit? (Hint: it's you!)">Submitted by: </label>
      <select id="submitted_by" name="submitted_by">
        <option value="">Loading SHARE users...</option>
      </select>
      <br><br>
      <!-- Description_Notes__c -->
      <label for="notes">Notes: </label>
      <textarea id="notes" name="notes" placeholder="Context, questions..."></textarea>
      <br><br>
      <button type="submit">SUBMIT</button>
    </form>
  </main>
<script>
  async function populateSelect(endpoint, selectId) {
  const response = await fetch(endpoint);
  const data = await response.json();

  const select = document.getElementById(selectId);

  select.innerHTML = '<option value="">Choose...</option>';

  for (const record of data.records) {
    const option = document.createElement("option");

    option.value = record.id;
    option.textContent = record.name;

    select.appendChild(option);
  }
}
  populateSelect("/.netlify/functions/sf_get_media_outlets", "publisher");
  populateSelect("/.netlify/functions/sf_get_reporters", "author");
  populateSelect("/.netlify/functions/sf_get_share_contacts", "share_spokesperson");
  populateSelect("/.netlify/functions/sf_get_share_users", "submitted_by");
  //populateSelect("/.netlify/functions/sf_get_organizations", "related_organization_1");
  //populateSelect("/.netlify/functions/sf_get_organizations", "related_organization_2");
  //populateSelect("/.netlify/functions/sf_get_organizations", "related_organization_3");
</script>
</body>
</html>
