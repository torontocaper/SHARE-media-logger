<!doctype html>
<html lang="en">
<head>
  <title>SHARE Media Logger: Add Media Hit</title>
</head>
<body>
  <main>
    <blockquote>
      Thank you for adding a media hit to SHARE's Salesforce database!
      <br><br>
      Some of this form's fields will have auto-populated when you activated the bookmarklet.
      <br><br>
      Please double-check their accuracy, and fill in as many of the other fields as you can.
      <br><br>
      If you have any questions, please <a id="adam_email" href="mailto:{{adam_email}}">contact Adam</a>.
    </blockquote>
    <br><br>
    <form method="POST" action="/.netlify/functions/create_media_hit">
      <label for="article_name">Article Name/Headline</label>
      <input
        id="article_name"
        name="article_name"
        type="text"
        value="{{article_name}}"
        required
      >
      <br><br>
      <label for="link_to_article">Article URL</label>
      <input
        id="link_to_article"
        name="link_to_article"
        type="url"
        value="{{link_to_article}}"
        required
      >
      <br><br>
      <label for="publisher">Publisher/Outlet</label>
      <input
        id="publisher"
        name="publisher"
        type="text"
        value=""
        placeholder="The Daily Planet"
      >
      <br><br>
      <label for="author">Reporter/Author</label>
      <input
        id="author"
        name="author"
        type="text"
        value=""
        placeholder="Clark Kent"
      >
      <br><br>
      <label for="date_of_article">Date the article was published</label>
      <input
        id="date_of_article"
        name="date_of_article"
        type="date"
        value=""
      >
      <br><br>
      <label for="submitted_by">Submitter</label>
      <select id="submitted_by" name="submitted_by">
        <option value="">Choose...</option>
        <option value="Adam Burns">Adam Burns</option>
        <option value="Other">Other / not listed</option>
      </select>
      <br><br>
      <label for="notes">Notes</label>
      <textarea
        id="notes"
        name="notes"
        placeholder="Any further details..."
      ></textarea>
      <br><br>
      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
