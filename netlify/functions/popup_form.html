<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SHARE Media Logger</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>SHARE Media Logger</h1>
    <p class="help">
      This form was pre-filled from the article page. Review the fields before submitting.
    </p>
    <form method="POST" action="/.netlify/functions/create_media_hit">
      <label for="article_name">Article Name / Headline</label>
      <input
        id="article_name"
        name="article_name"
        type="text"
        value="{{article_name}}"
        required
      >
      <label for="link_to_article">Article URL</label>
      <input
        id="link_to_article"
        name="link_to_article"
        type="url"
        value="{{link_to_article}}"
        required
      >
      <label for="publisher">Publisher / Outlet</label>
      <input
        id="publisher"
        name="publisher"
        type="text"
        value=""
        placeholder="The Daily Planet"
      >
      <label for="author">Author / Reporter</label>
      <input
        id="author"
        name="author"
        type="text"
        value=""
        placeholder="Clark Kent"
      >
      <label for="date_published">Date Published</label>
      <input
        id="date_published"
        name="date_published"
        type="date"
        value=""
      >
      <script>
      const today = new Date();

      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");

      document.getElementById("date_published").value = `${year}-${month}-${day}`;
      </script>
      <label for="submitted_by">Submitter</label>
      <select id="submitted_by" name="submitted_by">
        <option value="">Choose...</option>
        <option value="Adam Burns">Adam Burns</option>
        <option value="Other">Other / not listed</option>
      </select>
      <label for="notes">Notes</label>
      <textarea
        id="notes"
        name="notes"
        placeholder="Optional context, topics, spokesperson mentioned, etc."
      ></textarea>
      <button type="submit">Submit media hit</button>
    </form>
  </main>
</body>
</html>
